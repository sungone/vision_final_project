server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vision}
    username: ${DATABASE_USER:vision}
    password: ${DATABASE_PASSWORD:vision-local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
inspection:
  storage-root: ${IMAGE_STORAGE_ROOT:../storage}
  max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
  max-image-pixels: ${MAX_IMAGE_PIXELS:40000000}
  vision-url: ${VISION_URL:http://localhost:8001}
  vision-timeout-seconds: ${VISION_TIMEOUT_SECONDS:60}
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  settings-api-key: ${SETTINGS_API_KEY:}
  vision-service-token: ${VISION_SERVICE_TOKEN:}
  max-image-dimension: ${MAX_IMAGE_DIMENSION:8192}
